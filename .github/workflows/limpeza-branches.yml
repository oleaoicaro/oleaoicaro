name: Limpeza de branches

# Política de branch única (decisão 2026-07-27, Jarvis/memoria/decisoes.md):
# o repositório mantém apenas a branch padrão. Este workflow apaga todas as
# demais branches — mas SÓ as que já estão 100% mescladas na padrão.
# Branch com commit não mesclado nunca é apagada: ela é listada no resumo
# da execução para decisão manual (nada se perde sem trilha).
#
# Disparo manual (Actions → Limpeza de branches → Run workflow) ou pelo
# Jarvis via API. Exige confirmação explícita para evitar disparo acidental.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite SIM para apagar as branches extras já mescladas'
        required: true
        default: 'NAO'

permissions:
  contents: write

jobs:
  limpar:
    if: ${{ inputs.confirmar == 'SIM' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apagar branches mescladas (preservar as não mescladas)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune
          PADRAO='${{ github.event.repository.default_branch }}'
          apagadas=()
          preservadas=()
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin); do
            b="${ref#refs/remotes/origin/}"
            [ "$b" = "$PADRAO" ] && continue
            [ "$b" = "HEAD" ] && continue
            pendentes=$(git rev-list --count "origin/$PADRAO..origin/$b")
            if [ "$pendentes" -eq 0 ]; then
              git push origin --delete "$b"
              apagadas+=("$b")
            else
              preservadas+=("$b ($pendentes commit(s) não mesclado(s))")
            fi
          done
          {
            echo "## Limpeza de branches — resultado"
            echo
            echo "Branch padrão preservada: \`$PADRAO\`"
            echo
            echo "### Apagadas (${#apagadas[@]})"
            for b in "${apagadas[@]}"; do echo "- \`$b\`"; done
            echo
            echo "### Preservadas por terem trabalho não mesclado (${#preservadas[@]})"
            for b in "${preservadas[@]}"; do echo "- ⚠️ \`$b\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
